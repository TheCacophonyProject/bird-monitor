name: Android CI

# on:
on: [push]

  # push:
  #   # branches: [master]
  #   tags: ["*"]
  # pull_request:
  #   branches: [master]

env:
  API: 32
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin
          cache: gradle

      # - name: Install SDK components
      #   run: |
      #     yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" >/dev/null
      #     yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "tools" >/dev/null
      #     yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;32.0.0" >/dev/null
      #     yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-$API" >/dev/null
      #     yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "extras;android;m2repository" >/dev/null

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew clean assembleDebug

      - name: Decode signing key
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.SIGNING_TAR_BASE64 }}" | base64 -d > signing.tar
          tar xvf signing.tar

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew clean assembleRelease

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
